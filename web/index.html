<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AoS Stats Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #722f37 0%, #4a1e23 100%);
            height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        .container {
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #722f37 0%, #4a1e23 100%);
            color: white;
            padding: 16px 24px;
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2.1em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .content {
            display: flex;
            flex-wrap: nowrap;
            gap: 16px;
            padding: 16px 20px 20px 20px;
            flex: 1;
            min-height: 0;
        }

        .controls {
            flex: 1;
            min-width: 320px;
            max-width: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .chart-section {
            flex: 2;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .control-group {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .control-group h2 {
            color: #722f37;
            font-size: 1.1em;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #722f37;
        }

        .input-row {
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
            font-size: 0.85em;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: #d3d3d3;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #722f37;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #722f37;
            cursor: pointer;
        }

        .value-display {
            display: inline-block;
            background: #722f37;
            color: white;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
            min-width: 32px;
            text-align: center;
            float: right;
            font-size: 0.8em;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #722f37;
        }

        #chart-container {
            background: white;
            padding: 12px 16px 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            position: relative;
            flex: 1;
            min-height: 0;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #722f37 0%, #4a1e23 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(114, 47, 55, 0.3);
        }

        .stat-card .label {
            font-size: 0.8em;
            opacity: 0.9;
            margin-bottom: 3px;
        }

        .stat-card .value {
            font-size: 1.6em;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #722f37;
            font-size: 1em;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .chart-section {
                min-width: 300px;
            }

            h1 {
                font-size: 1.8em;
            }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }

        .error.active {
            display: block;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Age of Sigmar Damage Calculator</h1>
            <p class="subtitle">Calculate and visualize combat damage probabilities with WebAssembly</p>
        </header>

        <div class="content">
            <div class="controls">
                <div class="control-group">
                    <h2>Attack Stats</h2>
                    <div class="input-row">
                        <label>
                            Attacks:
                            <span class="value-display" id="attacks-notation" style="background: #4a1e23; min-width: 80px;">1</span>
                        </label>
                        <select id="attacks-type">
                            <option value="fixed">Fixed Value</option>
                            <option value="D3">D3</option>
                            <option value="D6">D6</option>
                            <option value="ND3">ND3+M</option>
                            <option value="ND6">ND6+M</option>
                        </select>
                    </div>
                    <div class="input-row" id="attacks-n-row">
                        <label>
                            Value: <span class="value-display" id="attacks-n-value">1</span>
                        </label>
                        <input type="range" id="attacks-n" min="1" max="40" value="1">
                    </div>
                    <div class="input-row" id="attacks-m-row" style="display: none;">
                        <label>
                            M (modifier): <span class="value-display" id="attacks-m-value">0</span>
                        </label>
                        <input type="range" id="attacks-m" min="0" max="20" value="0">
                    </div>
                    <div class="input-row">
                        <label>
                            To Hit (X+): <span class="value-display" id="to-hit-value">3+</span>
                        </label>
                        <input type="range" id="to-hit" min="2" max="6" value="3">
                    </div>
                    <div class="input-row">
                        <label>
                            To Wound (X+): <span class="value-display" id="to-wound-value">3+</span>
                        </label>
                        <input type="range" id="to-wound" min="2" max="6" value="3">
                    </div>
                    <div class="input-row">
                        <label>
                            Rend: <span class="value-display" id="rend-value">1</span>
                        </label>
                        <input type="range" id="rend" min="0" max="5" value="1">
                    </div>
                    <div class="input-row">
                        <label>
                            Damage:
                            <span class="value-display" id="damage-notation" style="background: #4a1e23; min-width: 80px;">1</span>
                        </label>
                        <select id="damage-type">
                            <option value="fixed">Fixed Value</option>
                            <option value="D3">D3</option>
                            <option value="D6">D6</option>
                            <option value="ND3">ND3+M</option>
                            <option value="ND6">ND6+M</option>
                        </select>
                    </div>
                    <div class="input-row" id="damage-n-row" style="display: none;">
                        <label>
                            N (multiplier): <span class="value-display" id="damage-n-value">1</span>
                        </label>
                        <input type="range" id="damage-n" min="1" max="10" value="1">
                    </div>
                    <div class="input-row" id="damage-m-row" style="display: none;">
                        <label>
                            M (modifier): <span class="value-display" id="damage-m-value">0</span>
                        </label>
                        <input type="range" id="damage-m" min="0" max="10" value="0">
                    </div>
                </div>

                <div class="control-group">
                    <h2>Defense Stats</h2>
                    <div class="input-row">
                        <label>
                            Save (X+): <span class="value-display" id="save-value">4+</span>
                        </label>
                        <input type="range" id="save" min="2" max="6" value="4">
                    </div>
                    <div class="input-row">
                        <label>
                            Ward (X+): <span class="value-display" id="ward-value">None</span>
                        </label>
                        <input type="range" id="ward" min="2" max="7" value="7">
                    </div>
                </div>

                <div class="control-group">
                    <h2>Hit Rule Type</h2>
                    <div class="input-row">
                        <select id="hit-rule">
                            <option value="normal">Normal</option>
                            <option value="crit_auto_wound">Critical Auto-Wound</option>
                            <option value="crit_mortal_wound">Critical Mortal Wound</option>
                            <option value="crit_double_hit">Critical Double Hit</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <div class="error" id="error-message"></div>
                <div class="loading" id="loading">Loading WASM module...</div>

                <div class="stats-summary" id="stats-summary" style="display: none;">
                    <div class="stat-card">
                        <div class="label">Mean Damage</div>
                        <div class="value" id="mean-damage">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Max Damage</div>
                        <div class="value" id="max-damage">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Hit Rule</div>
                        <div class="value" id="current-rule" style="font-size: 1.2em;">Normal</div>
                    </div>
                </div>

                <div id="chart-container">
                    <canvas id="damage-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
