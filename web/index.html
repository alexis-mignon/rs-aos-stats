<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AoS Stats Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .nav {
            background: #f8f9fa;
            padding: 10px 30px;
            border-bottom: 1px solid #dee2e6;
        }

        .nav a {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.3s;
            font-weight: 600;
        }

        .nav a:hover {
            background: #e9ecef;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }

        .controls {
            flex: 1;
            min-width: 350px;
        }

        .chart-section {
            flex: 2;
            min-width: 500px;
        }

        .control-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .control-group h2 {
            color: #667eea;
            font-size: 1.4em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .input-row {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #d3d3d3;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .value-display {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            float: right;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        #chart-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            position: relative;
            height: 500px;
        }

        canvas {
            max-height: 450px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .chart-section {
                min-width: 300px;
            }

            h1 {
                font-size: 1.8em;
            }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Age of Sigmar Damage Calculator</h1>
            <p class="subtitle">Calculate and visualize combat damage probabilities with WebAssembly</p>
        </header>

        <div class="nav">
            <a href="compare.html">Comparison Mode →</a>
        </div>

        <div class="content">
            <div class="controls">
                <div class="control-group">
                    <h2>Attack Stats</h2>
                    <div class="input-row">
                        <label>
                            Attacks: <span class="value-display" id="attacks-value">10</span>
                        </label>
                        <input type="range" id="attacks" min="1" max="30" value="10">
                    </div>
                    <div class="input-row">
                        <label>
                            To Hit (X+): <span class="value-display" id="to-hit-value">3+</span>
                        </label>
                        <input type="range" id="to-hit" min="2" max="6" value="3">
                    </div>
                    <div class="input-row">
                        <label>
                            To Wound (X+): <span class="value-display" id="to-wound-value">3+</span>
                        </label>
                        <input type="range" id="to-wound" min="2" max="6" value="3">
                    </div>
                    <div class="input-row">
                        <label>
                            Rend: <span class="value-display" id="rend-value">1</span>
                        </label>
                        <input type="range" id="rend" min="0" max="5" value="1">
                    </div>
                    <div class="input-row">
                        <label>
                            Damage: <span class="value-display" id="damage-value">1</span>
                        </label>
                        <input type="range" id="damage" min="1" max="6" value="1">
                    </div>
                </div>

                <div class="control-group">
                    <h2>Defense Stats</h2>
                    <div class="input-row">
                        <label>
                            Save (X+): <span class="value-display" id="save-value">4+</span>
                        </label>
                        <input type="range" id="save" min="2" max="6" value="4">
                    </div>
                    <div class="input-row">
                        <label>
                            Ward (X+): <span class="value-display" id="ward-value">None</span>
                        </label>
                        <input type="range" id="ward" min="2" max="7" value="7">
                    </div>
                </div>

                <div class="control-group">
                    <h2>Hit Rule Type</h2>
                    <div class="input-row">
                        <select id="hit-rule">
                            <option value="normal">Normal</option>
                            <option value="crit_auto_wound">Critical Auto-Wound</option>
                            <option value="crit_mortal_wound">Critical Mortal Wound</option>
                            <option value="crit_double_hit">Critical Double Hit</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <div class="error" id="error-message"></div>
                <div class="loading" id="loading">Loading WASM module...</div>

                <div class="stats-summary" id="stats-summary" style="display: none;">
                    <div class="stat-card">
                        <div class="label">Mean Damage</div>
                        <div class="value" id="mean-damage">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Max Damage</div>
                        <div class="value" id="max-damage">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Hit Rule</div>
                        <div class="value" id="current-rule" style="font-size: 1.2em;">Normal</div>
                    </div>
                </div>

                <div id="chart-container">
                    <canvas id="damage-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
